<!DOCTYPE html>
<html lang="en">
<head>
    <title>Certifications | Omar Mushtaq Portfolio</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f0f4ff">
    <meta name="description" content="Certifications and active learning goals from Omar Mushtaq, covering web development, Python, and cybersecurity fundamentals.">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="navbar-container">
    <nav class="navbar">
        <ul id="navList"></ul>
    </nav>
</div>
<main class="page-shell">
    <section class="page-hero scroll-reveal">
        <p class="eyebrow">Learning Path</p>
        <h1>Certifications</h1>
        <p class="page-lead">A collection of certifications that show the skills I have completed and the topics I am currently studying.</p>
    </section>

    <section class="certification-summary scroll-reveal" aria-label="Certification summary" id="certificationSummary">
        <!-- Dynamically populated from data.json -->
    </section>

    <section class="certification-section scroll-reveal" id="completedSection">
        <div class="section-heading">
            <p class="eyebrow">Completed</p>
            <h2>Earned Certifications</h2>
        </div>
        <div class="certification-grid" id="completedGrid">
            <!-- Dynamically populated from data.json -->
        </div>
    </section>

    <section class="certification-section scroll-reveal" id="in-progress">
        <div class="section-heading">
            <p class="eyebrow">Active Study</p>
            <h2>In Progress</h2>
        </div>
        <div class="certification-grid" id="inProgressGrid">
            <!-- Dynamically populated from data.json -->
        </div>
    </section>

</main>
<script src="../script.js" defer></script>
</body>
</html>
